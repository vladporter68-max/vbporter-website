<script>
(function(){

// ---------- Manhattan grid logic (ported from manhattan_grid.py) ----------
const AVENUE_ORDER = ["12th Ave","11th Ave","10th Ave","9th Ave","8th Ave","7th Ave",
  "6th Ave","5th Ave","Madison Ave","Park Ave","Lexington Ave","3rd Ave","2nd Ave","1st Ave","York Ave"];
const AVENUE_INDEX = {}; AVENUE_ORDER.forEach((a,i)=>AVENUE_INDEX[a]=i);
// Park Avenue South (14th St up to 32nd St) sits at the same east-west position as Park Ave,
// but its own building-number-to-cross-street numbering is completely different from Park Ave
// north of 32nd St. Give it the same east-west slot so bounding-box searches still include it
// correctly, while keeping its street-number formula separate below.
AVENUE_INDEX["Park Ave South"] = AVENUE_INDEX["Park Ave"];

const AVENUE_ALIASES = {
  "12th avenue":"12th Ave","12th ave":"12th Ave","twelfth avenue":"12th Ave","twelfth ave":"12th Ave",
  "11th avenue":"11th Ave","11th ave":"11th Ave","eleventh avenue":"11th Ave","eleventh ave":"11th Ave",
  "10th avenue":"10th Ave","10th ave":"10th Ave","tenth avenue":"10th Ave","tenth ave":"10th Ave",
  "9th avenue":"9th Ave","9th ave":"9th Ave","ninth avenue":"9th Ave","ninth ave":"9th Ave",
  "8th avenue":"8th Ave","8th ave":"8th Ave","eighth avenue":"8th Ave","eighth ave":"8th Ave",
  "7th avenue":"7th Ave","7th ave":"7th Ave","seventh avenue":"7th Ave","seventh ave":"7th Ave",
  "6th avenue":"6th Ave","6th ave":"6th Ave","sixth avenue":"6th Ave","sixth ave":"6th Ave",
  "avenue of the americas":"6th Ave","ave of americas":"6th Ave","ave of the americas":"6th Ave","avrnue of the americas":"6th Ave","avrnue of americas":"6th Ave",
  "5th avenue":"5th Ave","5th ave":"5th Ave","fifth avenue":"5th Ave","fifth ave":"5th Ave","fith avenue":"5th Ave","fith ave":"5th Ave",
  "4th avenue":"4th Ave","4th ave":"4th Ave","fourth avenue":"4th Ave","fourth ave":"4th Ave",
  "madison avenue":"Madison Ave","madison ave":"Madison Ave",
  "park avenue":"Park Ave","park ave":"Park Ave","park avnue":"Park Ave",
  // Park Avenue South is a DIFFERENT street from Park Avenue (different numbering below 32nd St)
  // -- it must never collapse into plain "Park Ave" or searches for the 40s/50s streets will
  // wrongly pull in NoMad/Union Square listings, and vice versa.
  "park avenue south":"Park Ave South","park ave south":"Park Ave South","park avnue south":"Park Ave South","park avrnue south":"Park Ave South",
  "lexington avenue":"Lexington Ave","lexington ave":"Lexington Ave","lex ave":"Lexington Ave",
  "3rd avenue":"3rd Ave","3rd ave":"3rd Ave","third ave":"3rd Ave","third avenue":"3rd Ave",
  "2nd avenue":"2nd Ave","2nd ave":"2nd Ave","second avenue":"2nd Ave","second ave":"2nd Ave",
  "1st avenue":"1st Ave","1st ave":"1st Ave","first avenue":"1st Ave","first ave":"1st Ave",
  "york avenue":"York Ave","york ave":"York Ave",
};

const FORMULAS = {
  "1st Ave": n=>n/20+3, "2nd Ave": n=>n/20+3, "3rd Ave": n=>n/20+10,
  "5th Ave": n=>{
    if(n>=63&&n<=108) return n/20+11;
    if(n>=109&&n<=200) return n/20+13;
    if(n>=201&&n<=400) return n/20+16;
    if(n>=401&&n<=600) return n/20+18;
    if(n>=601&&n<=775) return n/20+20;
    if(n>=776&&n<=1286) return n/10-18;
    if(n>=1287&&n<=1500) return n/20+45;
    if(n>=1501&&n<=2000) return n/20+24;
    return n/20+18;
  },
  "6th Ave": n=>n/20-12,
  "7th Ave": n=> n<=1800 ? n/20+12 : n/20+20,
  "8th Ave": n=>n/20+9, "9th Ave": n=>n/20+13, "10th Ave": n=>n/20+14, "11th Ave": n=>n/20+15,
  "Lexington Ave": n=>n/20+22, "Madison Ave": n=>n/20+27, "Park Ave": n=>n/20+35,
  // Approximate -- Park Ave South runs 14th St (low numbers) to 32nd St (high numbers, ~480).
  // Calibrated against 200 Park Ave South (17th St) and 386 Park Ave South (27th St, NoMad).
  "Park Ave South": n=>17+(n-200)*0.0538,
};

const AVE_PATTERN = /(\d+)[A-Za-z]?\s*(?:-\d+)?\s+(12th|11th|10th|9th|8th|7th|6th|5th|4th|3rd|2nd|1st|twelfth|eleventh|tenth|ninth|eighth|seventh|sixth|fifth|fith|fourth|third|second|first|madison|park(?:\s+(?:avenue|avnue|avrnue|ave)\s+south)?|lexington|lex|york|avenue of the americas|avrnue of the americas|ave of the americas|ave of americas)\s*(?:avenue|avrnue|ave)?\b/i;
const EXPLICIT_STREET = /\b(west|w|east|e)\.?\s*(\d{1,3})(?:st|nd|rd|th)?\s*(?:street|st)\b/i;
const BARE_STREET_NUM = /(\d{1,3})(?:st|nd|rd|th)?\s*street\s*&/i;
const STREET_AFTER_AMP = /&\s*(\d{1,3})(?:st|nd|rd|th)?\s*street/i;

function canonAvenue(raw){
  let key = raw.trim().toLowerCase().replace(/\s+/g," ");
  if(AVENUE_ALIASES[key]) return AVENUE_ALIASES[key];
  if(AVENUE_ALIASES[key+" avenue"]) return AVENUE_ALIASES[key+" avenue"];
  if(AVENUE_ALIASES[key+" ave"]) return AVENUE_ALIASES[key+" ave"];
  return null;
}

function parseLocation(address){
  if(typeof address !== "string") return {avenue:null, street:null, confidence:"low"};
  let avenue=null, street=null, confidence="low", num=null;
  const mAve = AVE_PATTERN.exec(address);
  if(mAve){ num = parseInt(mAve[1],10); avenue = canonAvenue(mAve[2]); }
  const mExplicit = EXPLICIT_STREET.exec(address);
  const mBare = BARE_STREET_NUM.exec(address);
  const mAmp = STREET_AFTER_AMP.exec(address);
  if(mExplicit) street = parseInt(mExplicit[2],10);
  else if(mBare) street = parseInt(mBare[1],10);
  else if(mAmp) street = parseInt(mAmp[1],10);

  if(avenue && street){ confidence="high"; }
  else if(avenue && FORMULAS[avenue]){
    street = Math.round(FORMULAS[avenue](num));
    if(street < 1 || street > 225){ street = null; confidence = "low"; }
    else { confidence="medium"; }
  }
  else if(street && !avenue){
    confidence="medium-low";
    if(mExplicit){ const side=mExplicit[1].toLowerCase(); avenue = side.startsWith("e") ? "EAST_SIDE" : "WEST_SIDE"; }
  } else if(avenue && !street){ confidence="low"; }
  return {avenue, street, confidence};
}

function avenueInRange(avenue, westBound, eastBound){
  const lo = AVENUE_INDEX[westBound], hi = AVENUE_INDEX[eastBound];
  // "West Side"/"East Side" means the address text said "West 55th St" or "East 42nd St"
  // but never named the avenue -- we don't know exactly which avenue, but we DO know which
  // half of Manhattan it's on (5th Ave is the West/East dividing line). If the requested
  // avenue range sits entirely on the other half, this address is impossible and can be
  // ruled out -- it shouldn't need a manual review at all. Otherwise it's still genuinely
  // ambiguous (the range straddles 5th, or is on the matching side) and goes to review.
  if(avenue==="WEST_SIDE"){
    if(lo > AVENUE_INDEX["5th Ave"]) return false;
    return null;
  }
  if(avenue==="EAST_SIDE"){
    if(hi < AVENUE_INDEX["Madison Ave"]) return false;
    return null;
  }
  if(avenue===null) return null;
  const idx = AVENUE_INDEX[avenue];
  if(idx===undefined) return null;
  return idx>=lo && idx<=hi;
}

// ---------- Independent address verification (US Census geocoder) ----------
// This is a SEPARATE check from the text-parsing logic above. Instead of guessing the avenue
// from the words in the address, it looks the real address up against the US Census Bureau's
// free public geocoding service (no account/key needed) to get its actual real-world map
// coordinates, then figures out which two avenues that point falls between geographically.
// This only runs when the user clicks "Verify" on the review list, and it needs an internet
// connection to work.
//
// AVENUE_LONGITUDE -- approximate real-world longitude of each avenue, calibrated around the
// 42nd-46th Street corridor (a central reference point for Manhattan office-suite searches).
// Manhattan's grid is rotated slightly off true north-south, so these values drift a little
// the further you get from that reference street -- same "approximate, not exact" spirit as
// the FORMULAS table above. Good enough to tell which avenue-to-avenue block a point falls in.
const AVENUE_LONGITUDE = {
  "12th Ave": -74.0013, "11th Ave": -73.9984, "10th Ave": -73.9955, "9th Ave": -73.9926,
  "8th Ave": -73.9897, "7th Ave": -73.9870, "6th Ave": -73.9841, "5th Ave": -73.9828,
  "Madison Ave": -73.9812, "Park Ave": -73.9796, "Lexington Ave": -73.9780,
  "3rd Ave": -73.9751, "2nd Ave": -73.9722, "1st Ave": -73.9693, "York Ave": -73.9664,
};

// Given a real longitude, find which two consecutive avenues (west one, east one) it falls
// between. Returns null if it's outside the modeled grid entirely (e.g. out past the river).
function bracketAvenues(lon){
  for(let i=0; i<AVENUE_ORDER.length-1; i++){
    const a = AVENUE_ORDER[i], b = AVENUE_ORDER[i+1];
    if(lon >= AVENUE_LONGITUDE[a] && lon <= AVENUE_LONGITUDE[b]){
      return {loIdx: i, hiIdx: i+1, loName: a, hiName: b};
    }
  }
  return null;
}

// Strips floor/suite/opening-date notes so the address text sent to the geocoder is just the
// plain street address -- extra text like "(Opening June 2026)" can confuse address lookups.
function cleanAddressForGeocoding(loc){
  let s = String(loc||"");
  s = s.replace(/\([^)]*\)/g, "");
  s = s.replace(/,?\s*floor[^,]*/gi, "");
  s = s.replace(/,?\s*suite[^,]*/gi, "");
  s = s.split(",")[0];
  return s.trim();
}

function sleep(ms){ return new Promise(resolve=>setTimeout(resolve, ms)); }

let _geocodeCbCounter = 0;
// Looks up one address via the Census Bureau's free public geocoder (JSONP, so it works
// straight from this local file with no server of its own). Resolves to {lat, lon,
// matchedAddress} on success, or null if the address couldn't be found or the request failed
// (e.g. no internet connection).
function geocodeOneline(address){
  return new Promise((resolve)=>{
    const cbName = "_geoCb" + (_geocodeCbCounter++);
    const script = document.createElement("script");
    const timer = setTimeout(()=>{ cleanup(); resolve(null); }, 8000);
    function cleanup(){
      clearTimeout(timer);
      try{ delete window[cbName]; }catch(e){ window[cbName]=undefined; }
      if(script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = function(data){
      cleanup();
      try{
        const match = data && data.result && data.result.addressMatches && data.result.addressMatches[0];
        if(match && match.coordinates){
          resolve({lat: match.coordinates.y, lon: match.coordinates.x, matchedAddress: match.matchedAddress});
        } else {
          resolve(null);
        }
      }catch(e){ resolve(null); }
    };
    script.onerror = ()=>{ cleanup(); resolve(null); };
    script.src = "https://geocoding.geo.census.gov/geocoder/locations/onelineaddress?address="
      + encodeURIComponent(address) + "&benchmark=4&format=jsonp&callback=" + cbName;
    document.body.appendChild(script);
  });
}

const KEEP_COLS = ["PropertyNo","Company","Location","Market","SubMarket","ZipCode","Contactname","Telephone","Email","Web Site","Notes","Opening Date"];
// Columns A, C, E, G, I, K, M, O of the original BackOffice layout — what's actually shown/exported.
const DISPLAY_COLS = ["PropertyNo","Company","Location","Market","SubMarket","ZipCode","Contactname","Telephone"];
// Client-facing copy excludes columns M (Contactname) and O (Telephone) so clients can't bypass the broker.
const CLIENT_DISPLAY_COLS = ["PropertyNo","Location","Market","SubMarket","ZipCode"];

function normSubmarket(v){
  if(v===undefined||v===null||v==="") return "Uncategorized";
  let s = String(v).trim().replace(/\s+/g," ");
  const fixes = {"time square":"Times Square","times square":"Times Square",
    "rockefeller center/ plaza district":"Rockefeller Center/Plaza District","flatiron":"Flatiron District",
    "finsncial district":"Financial District",
    "murry hill / midtown":"Murray Hill / Midtown",
    "midtownsouth/hudson square":"Midtown South/Hudson Square"};
  return fixes[s.toLowerCase()] || s;
}

// ---------- Submarket grouping (same real place, different names) ----------
// Each group merges raw SubMarket labels that genuinely refer to the same real submarket --
// either an exact "X / Y" combined-name label plus its standalone parts, or a verified true
// synonym (e.g. a suffix variant that plain text-matching wouldn't otherwise catch). This is
// curated by hand, not fully automatic -- automatic transitive merging was tried and produces
// wrong results (e.g. it would wrongly chain Flatiron all the way to Hudson Square just because
// both separately border NoMad/Midtown South). Checking any ONE checkbox in a group returns
// listings tagged with ANY of that group's raw labels.
const SUBMARKET_GROUPS = [
  { label: "Financial District / World Trade Center",
    members: ["Financial District", "Financial District/World Trade Center", "World Trade Center"] },
  { label: "Midtown South / Flatiron / NoMad",
    members: ["Midtown South", "Flatiron District", "Flatiron / NoMad", "NoMad", "Midtown South/NoMad"] },
  { label: "Penn Plaza / Herald Square / Penn Station",
    members: ["Penn Plaza", "Penn Plaza/Garment District", "Herald Square / Penn Plaza / Penn Station"] },
  { label: "SoHo / Tribeca",
    members: ["SoHo", "Tribeca", "Tribeca / SoHo"] },
  { label: "Plaza District / Rockefeller Center",
    members: ["Plaza District", "Rockefeller Center/Plaza District"] },
  { label: "Upper West Side / Lincoln Square",
    members: ["Upper West Side", "Lincoln Square / Upper West Side"] },
  { label: "Midtown / Murray Hill",
    members: ["Midtown", "Murray Hill / Midtown"] },
];
const SUBMARKET_GROUP_BY_MEMBER = {};
SUBMARKET_GROUPS.forEach(g => g.members.forEach(m => { SUBMARKET_GROUP_BY_MEMBER[m.toLowerCase()] = g; }));

function buildSubmarketChoices(uniqueRawSubmarkets){
  const presentSet = new Set(uniqueRawSubmarkets);
  const seenGroups = new Set();
  const choices = [];
  uniqueRawSubmarkets.forEach(raw=>{
    const group = SUBMARKET_GROUP_BY_MEMBER[raw.toLowerCase()];
    if(group){
      if(seenGroups.has(group.label)) return;
      seenGroups.add(group.label);
      const membersPresent = group.members.filter(m=>presentSet.has(m));
      choices.push({ label: group.label, members: membersPresent });
    } else {
      choices.push({ label: raw, members: [raw] });
    }
  });
  choices.sort((a,b)=>a.label.localeCompare(b.label));
  return choices;
}

// Appends "(Opening <date>)" to a plain address only while that date is still
// in the future. Once the date passes, the address displays plain with no
// manual cleanup needed -- this same function backs every place Location is
// shown (search results table, print reports, map labels), since it's applied
// once at extraction time in extractRows() below.
function formatLocationWithOpening(address, openingDateRaw){
  const addr = address || "";
  if(!openingDateRaw) return addr;

  let openingDate;
  if(openingDateRaw instanceof Date){
    openingDate = openingDateRaw;
  } else if(typeof openingDateRaw === "number"){
    // Excel serial date (SheetJS may hand back a raw serial if cellDates wasn't set)
    openingDate = XLSX.SSF ? new Date(Math.round((openingDateRaw - 25569) * 86400 * 1000)) : null;
  } else {
    const parsed = new Date(openingDateRaw);
    openingDate = isNaN(parsed.getTime()) ? null : parsed;
  }
  if(!openingDate || isNaN(openingDate.getTime())) return addr;

  const today = new Date();
  today.setHours(0,0,0,0);
  if(openingDate <= today) return addr; // already open -- show plain address

  const dateLabel = openingDate.toLocaleDateString("en-US", {month:"long", day:"numeric", year:"numeric"});
  return `${addr} (Opening ${dateLabel})`;
}

function extractRows(workbook){
  const sheet = workbook.Sheets["BackOffice"];
  if(!sheet) throw new Error("No 'BackOffice' tab found in this workbook.");
  const raw = XLSX.utils.sheet_to_json(sheet, {header:1, range:2, defval:""});
  const headerRow = raw[0].map(h=>String(h).trim());
  const colIdx = {};
  headerRow.forEach((h,i)=>{ if(!(h in colIdx)) colIdx[h]=i; });
  const rows = [];
  let lastCompany = "";
  for(let r=1; r<raw.length; r++){
    const row = raw[r];
    if(!row || row.every(c=>c==="" || c===undefined || c===null)) continue;
    const rec = {};
    KEEP_COLS.forEach(c=>{ rec[c] = colIdx[c]!==undefined ? row[colIdx[c]] : ""; });
    if(rec.Company){ lastCompany = rec.Company; } else { rec.Company = lastCompany; }
    rec.SubMarket_norm = normSubmarket(rec.SubMarket);
    rec.Location = formatLocationWithOpening(rec.Location, rec["Opening Date"]);
    rows.push(rec);
  }
  return rows;
}

function searchBounds(rows, streetMin, streetMax, westBound, eastBound){
  const main=[], review=[];
  rows.forEach(rec=>{
    if(String(rec.Market||"").trim() !== "Manhattan") return;
    const p = parseLocation(rec.Location);
    const streetOk = p.street!==null && p.street>=streetMin && p.street<=streetMax;
    const aveOk = avenueInRange(p.avenue, westBound, eastBound);
    const out = Object.assign({}, rec, {
      _ParsedStreet: p.street, _ParsedAvenue: (p.avenue==="EAST_SIDE"||p.avenue==="WEST_SIDE") ? `Unknown (${p.avenue.replace("_"," ")})` : p.avenue,
      _Confidence: p.confidence
    });
    if(streetOk && aveOk===true) main.push(out);
    else if(streetOk && aveOk===null) review.push(out);
  });
  return {main, review};
}

function searchSubmarket(rows, selectedSubmarkets){
  if(!selectedSubmarkets || selectedSubmarkets.length===0) return [];
  const wanted = new Set(selectedSubmarkets.map(s=>s.toLowerCase()));
  return rows.filter(r => wanted.has((r.SubMarket_norm||"").toLowerCase()));
}

// Populates the search form (submarket checklist, Run Search button) from a set of listing
// rows -- used both for the live workbook fetched automatically on open, and for the
// optional "Load a different file" override below.
function applyLoadedRows(loadedRows, statusHtml){
  rows = loadedRows;
  document.getElementById("uploadStatus").innerHTML = statusHtml;
  document.getElementById("runSearch").disabled = false;
  const uniqueSubmarkets = [...new Set(rows.map(r=>r.SubMarket_norm))].filter(Boolean).sort((a,b)=>a.localeCompare(b));
  const submarketChoices = buildSubmarketChoices(uniqueSubmarkets);
  const cbContainer = document.getElementById("submarketCheckboxes");
  cbContainer.innerHTML = submarketChoices.map((choice,i)=>
    `<label><input type="checkbox" class="submarket-cb" data-label="${choice.label.replace(/"/g,"&quot;")}" data-members='${JSON.stringify(choice.members).replace(/'/g,"&#39;")}' id="sm_cb_${i}"> ${choice.label}</label>`
  ).join("");
}

// Loads the workbook data that's built into this file, automatically, the moment the page
// opens -- no upload needed. This is a snapshot as of when this file was made; use "Load a
// different file" below only if you want to check a newer workbook without waiting for an
// updated copy of this app.
// Loads the workbook automatically from the same website this page is hosted on -- no upload
// needed. When you update Office_Suites_NYC.xlsx and push it live (same as always, via GitHub
// Desktop), reopening this app picks up the new data straight from the live file. If it's
// opened locally as a bare file (not through the website), this fetch can't work -- use
// "Load a different file instead" below in that case.
fetch("Office_Suites_NYC.xlsx")
  .then(res => {
    if(!res.ok) throw new Error("Could not find Office_Suites_NYC.xlsx on this site (status " + res.status + ")");
    return res.arrayBuffer();
  })
  .then(buf => {
    workbook = XLSX.read(new Uint8Array(buf), {type:"array"});
    const loadedRows = extractRows(workbook);
    const stamp = new Date().toLocaleString("en-US", {month:"long", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit"});
    applyLoadedRows(loadedRows, `<div class="ss-status success">Loaded ${loadedRows.length} listings (auto-loaded from vbporter.com, checked ${stamp}).</div>`);
  })
  .catch(err => {
    document.getElementById("uploadStatus").innerHTML = `<div class="ss-status error">Couldn't auto-load the workbook (${err.message}). Use "Load a different file instead" below.</div>`;
  });

let lastMain = [], lastReview = [], verifiedConfirmedRows = [], verifyingInProgress = false;

// Keeps every report/export button in lockstep with whether it's actually safe to use them
// right now: disabled with nothing searched yet, disabled while the background address check
// is still running (so you can never grab a report mid-verification), enabled once everything
// is settled.
function updateReportButtonsState(){
  const hasResults = lastMain.length>0 || lastReview.length>0;
  const disabled = !hasResults || verifyingInProgress;
  ["downloadBtn","printBrokerBtn","printClientBtn","mapBrokerBtn","mapClientBtn","emailBrokerBtn","emailClientBtn"].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.disabled = disabled;
  });
  const gate = document.getElementById("verifyGate");
  if(gate) gate.textContent = verifyingInProgress ? "Verifying addresses — reports will be ready in a few seconds…" : "";
}

function renderTable(list, columns){

// Runs when "Verify These Against Real Addresses" is clicked. Looks each review row's address
// up against the real world (via the US Census geocoder) one at a time, and marks each row
// as confirmed in range, confirmed OUT of range, or unable to verify (no internet, or the
// address couldn't be matched). This is separate from -- and more reliable than -- the
// text-guessing logic used everywhere else in this tool, because it's based on the address's
// actual real-world location rather than which words happen to appear in the spreadsheet cell.
async function verifyReviewRows(reviewRows, westBound, eastBound){
  verifyingInProgress = true;
  updateReportButtonsState();
  const statusLine = document.getElementById("verifyStatusLine");
  let confirmedIn = 0, confirmedOut = 0, unresolved = 0;
  for(let i=0; i<reviewRows.length; i++){
    const rec = reviewRows[i];
    const tr = document.querySelector(`#reviewTable tr[data-ridx="${i}"]`);
    const cell = tr ? tr.querySelector(".verify-status") : null;
    if(cell) cell.innerHTML = `<span class="verify-badge pending">Checking</span>`;
    if(statusLine) statusLine.textContent = `Checking address ${i+1} of ${reviewRows.length}…`;
    const queryAddr = cleanAddressForGeocoding(rec.Location) + ", New York, NY";
    let result = null;
    try{ result = await geocodeOneline(queryAddr); } catch(e){ result = null; }
    if(!result){
      unresolved++;
      if(cell){ cell.innerHTML = `<span class="verify-badge unresolved">Unresolved</span><div class="verify-detail">Address not found</div>`; }
    } else {
      const bracket = bracketAvenues(result.lon);
      if(!bracket){
        unresolved++;
        if(cell){ cell.innerHTML = `<span class="verify-badge unresolved">Unresolved</span><div class="verify-detail">Outside the modeled avenue grid</div>`; }
      } else {
        const loIdx = AVENUE_INDEX[westBound], hiIdx = AVENUE_INDEX[eastBound];
        const inRange = bracket.hiIdx >= loIdx && bracket.loIdx <= hiIdx;
        if(inRange){
          confirmedIn++;
          verifiedConfirmedRows.push(rec);
          if(cell){ cell.innerHTML = `<span class="verify-badge confirmed">Confirmed</span><div class="verify-detail">Between ${bracket.loName} &amp; ${bracket.hiName} — added to Client Copy</div>`; }
        } else {
          confirmedOut++;
          if(cell){ cell.innerHTML = `<span class="verify-badge outofrange">Not In Range</span><div class="verify-detail">Actually between ${bracket.loName} &amp; ${bracket.hiName}</div>`; }
        }
      }
    }
    await sleep(400); // be polite to the free public API -- no rush, this runs in the background
  }
  if(statusLine) statusLine.textContent = `Done — ${confirmedIn} confirmed and added to Client Copy, ${confirmedOut} confirmed not in range, ${unresolved} couldn't be checked automatically (still available in Broker Copy).`;
  verifyingInProgress = false;
  updateReportButtonsState();
}

document.getElementById("runSearch").addEventListener("click", ()=>{

  const reviewSection = document.getElementById("reviewSection");
  reviewSection.innerHTML = "";

  if(isBounds){
    const streetMin = parseInt(document.getElementById("streetMin").value,10);
    const streetMax = parseInt(document.getElementById("streetMax").value,10);
    const west = westSel.value, east = eastSel.value;
    if(AVENUE_INDEX[west] > AVENUE_INDEX[east]){
      statusEl.innerHTML = `<div class="ss-status error">West boundary must be west of the east boundary.</div>`;
      return;
    }
    const {main, review} = searchBounds(rows, streetMin, streetMax, west, east);
    lastMain = main; lastReview = review; verifiedConfirmedRows = [];
    document.getElementById("resultCount").textContent = `${main.length} confident match${main.length===1?"":"es"} between ${streetMin}th-${streetMax}th St, ${west}-${east}`;
    renderTable(main, DISPLAY_COLS.concat(["_ParsedStreet","_ParsedAvenue","_Confidence"]));
    if(review.length){
      reviewSection.innerHTML = `<div class="ss-review-note">${review.length} more row(s) matched the street range but the avenue couldn't be confirmed from the address text. Checking these against real addresses automatically — confirmed ones will be added to Client Copy on their own.</div>
        <div id="verifyStatusLine" style="font-size:12px; color:#5a6472; margin:8px 0;"></div>
        <div class="ss-table-wrap" id="reviewTableWrap"></div>`;
      const reviewTable = document.createElement("table");
      reviewTable.className = "ss-table";
      reviewTable.id = "reviewTable";
      document.getElementById("reviewTableWrap").appendChild(reviewTable);
      const cols = DISPLAY_COLS.concat(["_ParsedStreet","_ParsedAvenue","_Confidence"]);
      let html = "<tr>" + cols.map(c=>`<th>${c}</th>`).join("") + `<th>Address Check</th></tr>`;
      review.forEach((r,i)=>{ html += `<tr data-ridx="${i}">` + cols.map(c=>`<td>${r[c]!==undefined&&r[c]!==null?r[c]:""}</td>`).join("") + `<td class="verify-status"><span class="verify-badge pending">Queued</span></td></tr>`; });
      reviewTable.innerHTML = html;
      verifyReviewRows(review, west, east); // runs automatically -- no click needed
    }
  } else {
    const checkedBoxes = Array.from(document.querySelectorAll(".submarket-cb:checked"));
    if(checkedBoxes.length===0){
      statusEl.innerHTML = `<div class="ss-status error">Check at least one submarket first.</div>`;
      return;
    }
    const selectedLabels = checkedBoxes.map(cb=>cb.dataset.label);
    const selectedMembers = [];
    checkedBoxes.forEach(cb=>{
      JSON.parse(cb.dataset.members).forEach(m=>selectedMembers.push(m));
    });
    const matches = searchSubmarket(rows, selectedMembers);
    lastMain = matches; lastReview = []; verifiedConfirmedRows = [];
    document.getElementById("resultCount").textContent = `${matches.length} match${matches.length===1?"":"es"} for submarket(s): ${selectedLabels.join(", ")}`;
    renderTable(matches, DISPLAY_COLS);
  }

  resultsCard.style.display = "block";
  statusEl.innerHTML = "";
  updateReportButtonsState();
  lastIsBounds = isBounds;
  lastCriteriaText = isBounds
    ? `${document.getElementById("streetMin").value}th–${document.getElementById("streetMax").value}th St, between ${westSel.value} and ${eastSel.value}`
    : `Submarket(s): ${Array.from(document.querySelectorAll(".submarket-cb:checked")).map(cb=>cb.dataset.label).join(", ")}`;
});

document.getElementById("downloadBtn").addEventListener("click", ()=>{
  if(!workbook) return;
  const isBounds = modeBoundsBtn.classList.contains("active");
  const cols = isBounds ? DISPLAY_COLS.concat(["_ParsedStreet","_ParsedAvenue","_Confidence"]) : DISPLAY_COLS;

  const aoa = [];
  aoa.push([isBounds ? "SpaceSearch: street/avenue box result (see columns for parse confidence)" : `SpaceSearch: submarket keyword result for "${document.getElementById("keyword").value}"`]);
  aoa.push([]);
  aoa.push(cols);
  lastMain.forEach(r=> aoa.push(cols.map(c=>r[c]!==undefined&&r[c]!==null?r[c]:"")) );
  if(isBounds && lastReview.length){
    aoa.push([]);
    aoa.push([`NEEDS MANUAL REVIEW (${lastReview.length} rows) — avenue not confirmed`]);
    aoa.push(cols);
    lastReview.forEach(r=> aoa.push(cols.map(c=>r[c]!==undefined&&r[c]!==null?r[c]:"")) );
  }

  const newSheet = XLSX.utils.aoa_to_sheet(aoa);
  if(workbook.Sheets["SpaceSearch"]) {
    const idx = workbook.SheetNames.indexOf("SpaceSearch");
    workbook.SheetNames.splice(idx,1);
    delete workbook.Sheets["SpaceSearch"];
  }
  workbook.SheetNames.push("SpaceSearch");
  workbook.Sheets["SpaceSearch"] = newSheet;

  XLSX.writeFile(workbook, "Office_Suites_NYC_SpaceSearch.xlsx");
});

function buildReportMarkup(copyType){
  const isClient = copyType === "client";
  const printCols = isClient ? CLIENT_DISPLAY_COLS : DISPLAY_COLS;
  // Rows that matched the street range but whose avenue side the tool couldn't confirm
  // (e.g. address only gives a cross street, like "43rd Street & Broadway") used to be
  // silently merged in here as if they were fully confirmed matches. They're real listings
  // worth showing, but they need to be visibly marked as unconfirmed instead of hidden
  // inside the numbered list.
  const hasReview = !isClient && lastIsBounds && lastReview.length > 0;
  // Client Copy includes fully-confirmed matches PLUS any "needs review" rows that the
  // automatic background address check has since confirmed as real, in-range addresses.
  // Anything still unresolved or confirmed out-of-range never reaches the client -- only
  // Broker Copy (your own internal working copy) shows the full unfiltered review list.
  const allRows = isClient
    ? lastMain.concat(verifiedConfirmedRows)
    : (lastIsBounds ? lastMain.concat(lastReview) : lastMain);

  const companyName = document.getElementById("reportCompany").value.trim();
  const contactName = document.getElementById("reportContactName").value.trim();
  const contactPhoneOffice = document.getElementById("reportPhoneOffice").value.trim();
  const contactPhoneCell = document.getElementById("reportPhoneCell").value.trim();
  const chosenDate = document.getElementById("reportDate").value;
  const displayDate = chosenDate
    ? new Date(chosenDate + "T00:00:00").toLocaleDateString("en-US", {year:"numeric", month:"long", day:"numeric"})
    : new Date().toLocaleDateString("en-US", {year:"numeric", month:"long", day:"numeric"});

  const tagline = isClient ? "Manhattan Office Suites — Client Copy" : "Manhattan Office Suites — Broker Copy (Internal)";
  let preparedFor = "";
  if(companyName && contactName) preparedFor = `Prepared for: ${companyName} — Attn: ${contactName}`;
  else if(companyName) preparedFor = `Prepared for: ${companyName}`;
  else if(contactName) preparedFor = `Attn: ${contactName}`;
  // Phone numbers are for your own internal reference only -- they never print on the Client Copy.
  if(!isClient){
    const phoneParts = [];
    if(contactPhoneOffice) phoneParts.push(`Office: ${contactPhoneOffice}`);
    if(contactPhoneCell) phoneParts.push(`Cell: ${contactPhoneCell}`);
    if(phoneParts.length){
      preparedFor = preparedFor ? `${preparedFor} — ${phoneParts.join(" / ")}` : phoneParts.join(" / ");
    }
  }
  const resultLabel = `${allRows.length} result${allRows.length===1?"":"s"}`;

  const COL_WIDTHS = {
    "#": 3, PropertyNo: 5, Company: 12, Location: 24, Market: 8, SubMarket: 14,
    ZipCode: 6, Contactname: 11, Telephone: 10,
  };
  const printColsWithNum = ["#"].concat(printCols);
  let usedWidth = printColsWithNum.reduce((sum,c)=> sum + (COL_WIDTHS[c]||10), 0) + 12; // +12 for notes col
  let colgroupHTML = "<colgroup>" + printColsWithNum.map(c=>{
    const pct = ((COL_WIDTHS[c]||10) / usedWidth * 100).toFixed(1);
    return `<col style="width:${pct}%">`;
  }).join("") + `<col class="print-notes-col" style="width:${(12/usedWidth*100).toFixed(1)}%"></colgroup>`;

  const totalCols = printColsWithNum.length + 1; // +1 for Notes col
  let tableHTML = colgroupHTML + "<tr>" + printColsWithNum.map(c=>`<th>${c==="Contactname"?"Contact":c}</th>`).join("") + `<th class="print-notes-col">Notes</th></tr>`;
  allRows.forEach((r, i)=>{
    if(hasReview && i === lastMain.length){
      tableHTML += `<tr><td colspan="${totalCols}" style="background:#FFF6DD; color:#8A6D00; font-weight:700; padding:8px 6px;">Needs manual review below — avenue side could not be confirmed automatically; please verify the address</td></tr>`;
    }
    tableHTML += `<tr><td>${i+1}</td>` + printCols.map(c=>`<td>${r[c]!==undefined&&r[c]!==null?r[c]:""}</td>`).join("") + `<td class="print-notes-col">&nbsp;</td></tr>`;
  });

  const fullHTML = `
    <div class="print-header">
      <div>
        <div class="print-company">VB Porter &amp; Company LLC</div>
        <div class="print-tagline">${tagline}</div>
      </div>
      <div class="print-meta">
        <div style="font-weight:700; color:#1F3864;">${preparedFor}</div>
        <div>${displayDate}</div>
        <div>${resultLabel}</div>
      </div>
    </div>
    <div class="print-criteria">Search criteria — ${lastCriteriaText}</div>
    <table class="print-table">${tableHTML}</table>
    <div class="print-footnote">This information is property of VB Porter &amp; Company</div>
  `;

  return { fullHTML, tagline };
}

// ---------- Map view (OpenStreetMap + Nominatim geocoding, no API key needed) ----------
const geocodeCache = {};

async function geocodeAddress(query){
  if(geocodeCache[query] !== undefined) return geocodeCache[query];
  try {
    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q=${encodeURIComponent(query)}`;
    const res = await fetch(url, { headers: { "Accept-Language": "en" } });
    const data = await res.json();
    if(data && data.length){
      const result = { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
      geocodeCache[query] = result;
      return result;
    }
  } catch(e){ console.error("Geocode failed for", query, e); }
  geocodeCache[query] = null;
  return null;
}

async function geocodeAll(rowsWithNum, statusEl){
  const results = [];
  for(let i=0;i<rowsWithNum.length;i++){
    const { num, row } = rowsWithNum[i];
    const boroughPart = row.Market && row.Market !== "Manhattan" ? row.Market : "Manhattan";
    const query = `${row.Location}, ${boroughPart}, New York, NY`;
    statusEl.textContent = `Locating addresses on the map… ${i+1} of ${rowsWithNum.length}`;
    const geo = await geocodeAddress(query);
    if(geo) results.push({ num, row, lat: geo.lat, lon: geo.lon });
    if(i < rowsWithNum.length-1) await new Promise(res=>setTimeout(res, 1100));
  }
  return results;
}

let currentMapData = null;
let currentMapCopyType = "broker";
let leafletMapInstance = null;

async function openMapView(copyType){
  currentMapCopyType = copyType;
  const allRows = lastIsBounds ? lastMain.concat(lastReview) : lastMain;
  const rowsWithNum = allRows.map((r,i)=>({ num: i+1, row: r }));

  document.getElementById("mapTitleLabel").textContent = copyType === "client" ? "Map View — Client Copy" : "Map View — Broker Copy";
  document.getElementById("mapOverlay").classList.add("active");
  document.getElementById("mapPrintBtn").disabled = true;
  const statusEl = document.getElementById("mapStatus");
  statusEl.textContent = "Locating addresses on the map…";

  if(leafletMapInstance){ leafletMapInstance.remove(); leafletMapInstance = null; }
  document.getElementById("mapContainer").innerHTML = "";

  const geocoded = await geocodeAll(rowsWithNum, statusEl);
  currentMapData = geocoded;

  if(geocoded.length === 0){
    statusEl.textContent = "Couldn't locate any of these addresses on the map. Try again, or check your internet connection.";
    return;
  }

  statusEl.textContent = `Showing ${geocoded.length} of ${allRows.length} location(s) on the map.` +
    (geocoded.length < allRows.length ? " Some addresses could not be matched to a map location." : "");

  const map = L.map("mapContainer");
  leafletMapInstance = map;
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '© OpenStreetMap contributors', maxZoom: 19
  }).addTo(map);

  const bounds = [];
  geocoded.forEach(pt=>{
    const icon = L.divIcon({ className:"", html:`<div class="map-marker-num">${pt.num}</div>`, iconSize:[30,30], iconAnchor:[15,15] });
    const label = copyType === "client"
      ? `#${pt.num} — ${pt.row.Location}`
      : `#${pt.num} — ${pt.row.Company} — ${pt.row.Location}`;
    L.marker([pt.lat, pt.lon], { icon }).addTo(map).bindPopup(label);
    bounds.push([pt.lat, pt.lon]);
  });
  map.fitBounds(bounds, { padding: [30,30] });

  document.getElementById("mapPrintBtn").disabled = false;
}

function closeMapView(){
  document.getElementById("mapOverlay").classList.remove("active");
}

      .print-header { display:flex; justify-content:space-between; align-items:flex-end; border-bottom: 3px solid #1F3864; padding-bottom: 10px; margin-bottom: 12px; }
      .print-company { font-size: 20px; font-weight: 800; color: #1F3864; }

function emailReport(copyType){
  const { fullHTML } = buildReportMarkup(copyType);
  const companyName = document.getElementById("reportCompany").value.trim();
  const contactName = document.getElementById("reportContactName").value.trim();

  const printWindow = window.open("", "_blank", "width=1400,height=900");
  if(!printWindow){
    alert("Your browser blocked the print window pop-up. Please allow pop-ups for this page and try again.");
    return;
  }
  printWindow.document.write(`<!DOCTYPE html><html><head><title>SpaceSearch Report</title>
    <meta charset="utf-8"><style>${PRINT_DOC_CSS}</style></head>
    <body>${fullHTML}</body></html>`);
  printWindow.document.close();
  printWindow.focus();

  const doPrint = () => { printWindow.print(); };
  printWindow.onload = doPrint;
  setTimeout(doPrint, 400);

  // Give the person a moment to save the PDF from the print dialog (choose
  // "Save as PDF" as the destination), then open a pre-filled email draft.
  setTimeout(()=>{
    const greeting = contactName ? `Hi ${contactName},` : "Hi,";
    const subject = encodeURIComponent(
      `Manhattan Office Suites — ${copyType === "client" ? "Options for You" : "Broker Copy"}${companyName ? " — " + companyName : ""}`
    );
    const body = encodeURIComponent(
      `${greeting}\n\nPlease see the attached Manhattan office suites list${companyName ? " prepared for " + companyName : ""}.\n\n` +
      `In the window that just opened, choose "Save as PDF" as the printer/destination to save the file, then attach it here before sending.\n\n` +
      `Best,\nVB Porter & Company LLC`
    );
    window.location.href = `mailto:?subject=${subject}&body=${body}`;
  }, 800);
}
